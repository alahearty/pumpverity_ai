[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "petrosense-ml"
version = "0.6.0"
description = "Reproducible research training and evaluation pipeline for PUMPVERITY AI"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<4.0",
    "scikit-learn>=1.5,<2.0",
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["petrosense_ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["petrosense_ml", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]


