[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "petrosense-edge"
version = "0.6.0"
description = "Offline-capable edge simulation and validation pipeline for PUMPVERITY AI"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "ruff>=0.8,<1.0"]

[tool.setuptools.packages.find]
include = ["petrosense_edge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["petrosense_edge", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]


